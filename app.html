<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BE SHAD TRADER — POS, Inventory & Accounting</title>
<style>
:root{--bg:#F3F5F8;--sf:#fff;--sf2:#EDF1F5;--ink:#0E2238;--mut:#5B6B7F;--line:#DCE2EA;--br:#0E3A5F;--brink:#fff;--ac:#F2A413;--acink:#2A1C00;--gd:#1B8F5F;--bd:#C2453A;--wn:#B9770E;--side:#0E2A47;--sideink:#C9D8E8;--sh:0 1px 2px rgba(14,34,56,.06),0 6px 20px rgba(14,34,56,.06)}
[data-theme=dark]{--bg:#0A1522;--sf:#101F31;--sf2:#15283D;--ink:#EAF0F7;--mut:#9FB0C4;--line:#22364D;--br:#5BA3DB;--brink:#06121F;--gd:#3FC68C;--bd:#E5776C;--wn:#E0A84A;--side:#0B1B2E;--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
h1,h2,h3{margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
#side{background:var(--side);color:var(--sideink);position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:4px;z-index:40}
.brand{display:flex;gap:10px;align-items:center;color:#fff;font-weight:800;letter-spacing:.03em;padding:4px 8px 16px}
.brand small{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--sideink);opacity:.8}
#side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--sideink);text-decoration:none;font-weight:600}
#side a:hover{background:rgba(255,255,255,.07)}
#side a.on{background:var(--ac);color:var(--acink)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 20px}
.top h1{font-size:20px;white-space:nowrap}
.gs{position:relative;flex:1;max-width:420px;margin-left:auto}
.gs input{width:100%}
#gres{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--sf);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
#gres button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px 14px;cursor:pointer}
#gres button:hover{background:var(--sf2)}
#gres small{color:var(--mut);min-width:70px}
#view{padding:20px;max-width:1500px;width:100%}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sf);cursor:pointer;display:none;place-items:center}
.ib.show{display:grid}
.b{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--sf2);color:var(--ink)}
.b:hover{filter:brightness(.96)}
.b-p{background:var(--br);color:var(--brink)}
.b-a{background:var(--ac);color:var(--acink)}
.b-d{background:color-mix(in srgb,var(--bd) 16%,transparent);color:var(--bd)}
.b-s{padding:5px 10px;font-size:13px;border-radius:8px}
.in{border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:9px 12px;min-width:0}
.in:focus{border-color:var(--br)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:600}
label.f .in{font-size:15px;color:var(--ink);font-weight:400}
label.f .in{width:100%}
.fg>*{min-width:0}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1;min-width:180px}
.sp{margin-left:auto}
.tabs{display:inline-flex;flex-wrap:wrap;background:var(--sf2);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--mut);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--sf);color:var(--ink);box-shadow:var(--sh)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card span{display:block;color:var(--mut);font-size:13px;font-weight:600}
.card strong{display:block;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h3{font-size:15px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.two>.panel{margin:0}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--line);border-radius:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--sf2);color:var(--mut);font-size:12.5px;text-align:left;padding:10px 12px;white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl .r,.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:800;background:var(--sf2)}
.empty{padding:36px;text-align:center;color:var(--mut);background:var(--sf);border:1px dashed var(--line);border-radius:14px}
.bdg{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sf2);color:var(--mut)}
.bdg.ok{background:color-mix(in srgb,var(--gd) 16%,transparent);color:var(--gd)}
.bdg.bad{background:color-mix(in srgb,var(--bd) 16%,transparent);color:var(--bd)}
.bdg.wn{background:color-mix(in srgb,var(--wn) 18%,transparent);color:var(--wn)}
.up{color:var(--gd)}.dn{color:var(--bd)}
.bars{display:flex;align-items:flex-end;gap:4px;height:170px}
.bars div{flex:1;min-width:6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mut)}
.bars i{display:block;width:100%;background:var(--br);border-radius:4px 4px 0 0;min-height:2px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.list li:last-child{border:0}
.banner{background:color-mix(in srgb,var(--ac) 20%,var(--sf));border:1px solid var(--ac);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* POS */
.pos{display:grid;grid-template-columns:1fr 400px;gap:16px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pgrid button{text-align:left;background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:92px}
.pgrid button:hover{border-color:var(--br)}
.pgrid button:disabled{opacity:.45;cursor:not-allowed}
.pgrid b{font-size:14px;line-height:1.25}
.pgrid em{font-style:normal;font-weight:800;color:var(--br);margin-top:auto}
.pgrid small{color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--br);color:var(--brink);border-color:var(--br)}
.cart{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px;position:sticky;top:76px;display:flex;flex-direction:column;gap:10px}
.cl{display:grid;grid-template-columns:1fr 64px 84px 26px;gap:6px;align-items:center;font-size:13.5px}
.cl .in{padding:6px 8px;width:100%}
.cl-w{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.tot{display:flex;justify-content:space-between;font-size:14px}
.tot.big{font-size:22px;font-weight:800}
/* modal */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--sf);color:var(--ink);padding:0;width:min(560px,calc(100% - 24px));box-shadow:0 30px 80px rgba(0,0,0,.4);max-height:92vh}
dialog.wide{width:min(900px,calc(100% - 24px))}
dialog::backdrop{background:rgba(6,14,24,.55)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{font-size:18px}
#mb{padding:18px 20px;overflow-y:auto;max-height:64vh}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;box-shadow:var(--sh);font-weight:600;max-width:340px}
.toast.err{background:var(--bd);color:#fff}
/* invoice */
.inv{font-size:13.5px;color:#111;background:#fff;padding:18px;border-radius:8px;border:1px solid #ddd}
.inv h2{font-size:20px;margin:0}.inv h3{margin:0;font-size:18px;letter-spacing:.1em}
.inv-h{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #0E3A5F;padding-bottom:10px;margin-bottom:10px}
.inv table{width:100%;border-collapse:collapse;margin:10px 0}
.inv th,.inv td{padding:6px 8px;border-bottom:1px solid #e3e3e3;text-align:left}
.inv .r{text-align:right}
.inv .sum{margin-left:auto;width:min(260px,100%)}
.inv .sum div{display:flex;justify-content:space-between;padding:3px 0}
.inv .ft{margin-top:14px;color:#555;text-align:center}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}.inv{border:0;padding:0}}
#bottom{display:none}
@media(max-width:1100px){.pos{grid-template-columns:1fr}.cart{position:static}.two{grid-template-columns:1fr}}
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-100%);transition:transform .2s}
  #side.open{transform:none}
  .ib{display:grid}
  #view{padding:14px 14px 90px}
  .top{padding:10px 14px}
  .top h1{font-size:17px}
  #bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--line);z-index:35;padding-bottom:env(safe-area-inset-bottom,0px)}
  #bottom a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;font-size:11px;font-weight:700;color:var(--mut);text-decoration:none}
  #bottom a.on{color:var(--br)}
  #bottom span{font-size:18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Main menu">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="#F2A413"/><rect x="9" y="8" width="5" height="20" rx="1.5" fill="#0E2A47"/><path d="M14 8h6.5a5 5 0 0 1 0 10H14M14 18h7.5a5 5 0 0 1 0 10H14" fill="none" stroke="#0E2A47" stroke-width="4.4" stroke-linejoin="round"/></svg>
      <div>BE SHAD TRADER<small>POS · INVENTORY · ACCOUNTS</small></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="main">
    <header class="top">
      <button class="ib" id="burger" aria-label="Open menu">☰</button>
      <h1 id="title">Dashboard</h1>
      <div class="gs"><input class="in" id="gsearch" placeholder="Search products, customers, invoices…" autocomplete="off" aria-label="Global search"><div id="gres" hidden></div></div>
      <button class="ib show" id="theme" aria-label="Switch theme">◐</button>
    </header>
    <main id="view"></main>
  </div>
</div>
<nav id="bottom" aria-label="Quick menu"></nav>
<dialog id="modal"><div class="mh"><h3 id="mt"></h3><button class="b b-s" id="mx" aria-label="Close">✕</button></div><div id="mb"></div><div class="mf"><button class="b" id="mc">Cancel</button><button class="b b-p" id="mok">Save</button></div></dialog>
<div id="toasts" aria-live="polite"></div>
<div id="printArea"></div>

<script>
'use strict';
/*CORE-START*/
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const KEY='bst_app_v1';
let memStore=null,persist=true;
const store={
  get(){try{return localStorage.getItem(KEY)}catch(e){persist=false;return memStore}},
  set(v){try{localStorage.setItem(KEY,v)}catch(e){persist=false;memStore=v}}
};
const r2=n=>Math.round((Number(n)||0)*100)/100;
const r3=n=>Math.round((Number(n)||0)*1000)/1000;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const pd=s=>{const a=String(s).split('-');return new Date(+a[0],+a[1]-1,+a[2])};
const addDays=(d,n)=>{const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x};
const today=()=>ymd(new Date());
const dayOff=n=>ymd(addDays(new Date(),n));
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const ACCTS=[['1000','Cash in Hand','asset'],['1010','Bank Account','asset'],['1100','Accounts Receivable','asset'],['1200','Inventory','asset'],['2000','Accounts Payable','liability'],['2100','Sales Tax Payable','liability'],['3000',"Owner's Equity",'equity'],['4000','Sales Revenue','income'],['4100','Sales Returns','income'],['5000','Cost of Goods Sold','expense'],['5100','Stock Loss & Adjustments','expense'],['6000','Rent','expense'],['6010','Electricity','expense'],['6020','Fuel','expense'],['6030','Salary','expense'],['6040','Transport','expense'],['6050','Maintenance','expense'],['6060','Marketing','expense'],['6070','Office Expenses','expense'],['6099','Other Expenses','expense']];
const fresh=()=>({v:1,seq:1,n:{inv:1,pur:1,rcp:1,pay:1},settings:{name:'Be Shad Trader',address:'',phone:'',email:'',currency:'Rs',taxRate:0,invPrefix:'INV-',footer:'Thank you for your business.',allowNegative:false},accounts:ACCTS.map(a=>({code:a[0],name:a[1],type:a[2]})),journal:[],products:[],customers:[],suppliers:[],sales:[],purchases:[],movements:[],payments:[],expenses:[],orders:[]});
let S;
try{const raw=store.get();S=raw?Object.assign(fresh(),JSON.parse(raw)):fresh();S.settings=Object.assign(fresh().settings,S.settings)}catch(e){S=fresh()}
const save=()=>store.set(JSON.stringify(S));
const uid=()=>S.seq++;
const money=n=>S.settings.currency+' '+r2(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const qty=n=>r3(n).toLocaleString('en-US',{maximumFractionDigits:3});
const prod=id=>S.products.find(p=>p.id===id);
const cust=id=>S.customers.find(c=>c.id===id);
const supp=id=>S.suppliers.find(c=>c.id===id);
const acct=code=>S.accounts.find(a=>a.code===code);
const payAcc=m=>m==='cash'?'1000':'1010';
const dueOf=s=>r2(s.total-s.paid-(s.credited||0));
const pDueOf=p=>r2(p.total-p.paid-(p.credited||0));
const custBalance=c=>r2(c.opening+S.sales.filter(s=>s.customerId===c.id).reduce((a,s)=>a+dueOf(s),0));
const supBalance=c=>r2(c.opening+S.purchases.filter(p=>p.supplierId===c.id).reduce((a,p)=>a+pDueOf(p),0));

function post(date,ref,memo,lines){
  lines=lines.map(l=>({acc:l.acc,dr:r2(l.dr),cr:r2(l.cr)})).filter(l=>l.dr||l.cr);
  const d=r2(lines.reduce((a,l)=>a+l.dr,0)),c=r2(lines.reduce((a,l)=>a+l.cr,0));
  if(d!==c)throw new Error('Journal entry is not balanced ('+d+' vs '+c+')');
  if(!lines.length)return;
  S.journal.push({id:uid(),date,ref,memo,lines});
}
function acctTotals(code,f,t){
  let dr=0,cr=0;
  for(const j of S.journal){
    if(f&&j.date<f)continue;if(t&&j.date>t)continue;
    for(const l of j.lines)if(l.acc===code){dr+=l.dr;cr+=l.cr}
  }
  return{dr:r2(dr),cr:r2(cr)};
}
function natBal(a,f,t){const x=acctTotals(a.code,f,t);return r2((a.type==='asset'||a.type==='expense')?x.dr-x.cr:x.cr-x.dr)}
function move(pid,type,q,ref,note,date){
  const p=prod(pid);p.stock=r3(p.stock+q);
  S.movements.push({id:uid(),date:date||today(),pid,type,qty:r3(q),ref:ref||'',note:note||''});
}
function createProduct(o){
  const name=String(o.name||'').trim();if(!name)throw new Error('Product name is required');
  const sku=String(o.sku||'').trim()||('P'+String(S.seq).padStart(4,'0'));
  if(S.products.some(p=>p.sku.toLowerCase()===sku.toLowerCase()))throw new Error('SKU already exists: '+sku);
  const p={id:uid(),name,sku,barcode:String(o.barcode||'').trim(),category:String(o.category||'').trim()||'General',brand:o.brand||'',unit:o.unit||'pcs',cost:+o.cost||0,price:+o.price||0,wholesale:+o.wholesale||+o.price||0,min:+o.min||0,stock:0,active:true};
  S.products.push(p);
  const st=+o.stock||0;
  if(st>0){move(p.id,'Opening Stock',st,'OPEN','',o.date);post(o.date||today(),'OPEN','Opening stock: '+name,[{acc:'1200',dr:st*p.cost},{acc:'3000',cr:st*p.cost}])}
  return p;
}
function createParty(kind,o){
  const name=String(o.name||'').trim();if(!name)throw new Error('Name is required');
  const list=kind==='c'?S.customers:S.suppliers;
  const op=r2(+o.opening||0);
  const c={id:uid(),name,company:o.company||'',phone:o.phone||'',whatsapp:o.whatsapp||'',email:o.email||'',address:o.address||'',city:o.city||'',area:o.area||'',creditLimit:+o.creditLimit||0,opening:op,openingInit:op};
  list.push(c);
  if(op>0){
    if(kind==='c')post(o.date||today(),'OPEN','Opening balance: '+name,[{acc:'1100',dr:op},{acc:'3000',cr:op}]);
    else post(o.date||today(),'OPEN','Opening balance: '+name,[{acc:'3000',dr:op},{acc:'2000',cr:op}]);
  }
  return c;
}
function createSale(o){
  if(!o.items||!o.items.length)throw new Error('Add at least one item');
  const items=o.items.map(it=>{
    const p=prod(it.pid);if(!p)throw new Error('Product not found');
    const q=+it.qty;if(!(q>0))throw new Error('Invalid quantity for '+p.name);
    if(!S.settings.allowNegative&&p.stock<q)throw new Error('Not enough stock for '+p.name+' (available '+qty(p.stock)+')');
    return{pid:p.id,name:p.name,unit:p.unit,qty:q,price:+it.price||0,cost:p.cost,returned:0};
  });
  const subtotal=r2(items.reduce((a,i)=>a+i.qty*i.price,0));
  const discount=r2(Math.min(Math.max(+o.discount||0,0),subtotal));
  const rev=r2(subtotal-discount);
  const taxRate=+o.taxRate||0;
  const tax=r2(rev*taxRate/100);
  const total=r2(rev+tax);
  const paid=r2(Math.min(Math.max(+o.paid||0,0),total));
  const due=r2(total-paid);
  if(due>0){
    if(!o.customerId)throw new Error('Select a customer for a credit or partial payment sale');
    const c=cust(o.customerId);
    if(c.creditLimit>0&&custBalance(c)+due>c.creditLimit)throw new Error('Credit limit exceeded for '+c.name+' (limit '+money(c.creditLimit)+')');
  }
  const no=S.settings.invPrefix+String(S.n.inv++).padStart(5,'0');
  const cogs=r2(items.reduce((a,i)=>a+i.qty*i.cost,0));
  const date=o.date||today();
  const s={id:uid(),no,date,customerId:o.customerId||null,items,subtotal,discount,taxRate,tax,total,paid,paid0:paid,method:o.method||'cash',credited:0,cogs,note:o.note||'',returns:[]};
  S.sales.push(s);
  items.forEach(i=>move(i.pid,'Sale',-i.qty,no,'',date));
  post(date,no,'Sales invoice '+no,[{acc:payAcc(s.method),dr:paid},{acc:'1100',dr:due},{acc:'4000',cr:rev},{acc:'2100',cr:tax},{acc:'5000',dr:cogs},{acc:'1200',cr:cogs}]);
  return s;
}
function saleReturn(sid,qs,method,date){
  const s=S.sales.find(x=>x.id===sid);date=date||today();
  let net=0,cg=0;const ret=[];
  s.items.forEach((it,i)=>{
    const q=+qs[i]||0;if(q<=0)return;
    if(q>it.qty-it.returned+1e-9)throw new Error('Return quantity too high for '+it.name);
    net+=q*it.price;cg+=q*it.cost;ret.push({i,q});
  });
  if(!ret.length)throw new Error('Enter a quantity to return');
  const f=s.subtotal?1-s.discount/s.subtotal:1;
  const rev=r2(net*f),tax=r2(rev*s.taxRate/100),tot=r2(rev+tax);
  const credit=r2(Math.min(dueOf(s),tot)),refund=r2(tot-credit);
  cg=r2(cg);
  ret.forEach(x=>{const it=s.items[x.i];it.returned=r3(it.returned+x.q);move(it.pid,'Sale Return',x.q,s.no,'',date)});
  s.credited=r2((s.credited||0)+credit);
  s.returns.push({date,rev,tax,tot,credit,refund});
  post(date,s.no,'Sales return '+s.no,[{acc:'4100',dr:rev},{acc:'2100',dr:tax},{acc:'1100',cr:credit},{acc:payAcc(method||'cash'),cr:refund},{acc:'1200',dr:cg},{acc:'5000',cr:cg}]);
}
function createPurchase(o){
  if(!o.items||!o.items.length)throw new Error('Add at least one item');
  const items=o.items.map(it=>{
    const p=prod(it.pid);if(!p)throw new Error('Select a product in every row');
    const q=+it.qty,c=+it.cost;
    if(!(q>0))throw new Error('Invalid quantity for '+p.name);
    if(!(c>=0))throw new Error('Invalid cost for '+p.name);
    return{pid:p.id,name:p.name,qty:q,cost:c,uc:c,returned:0};
  });
  const gross=r2(items.reduce((a,i)=>a+i.qty*i.cost,0));
  const discount=r2(Math.min(Math.max(+o.discount||0,0),gross));
  const total=r2(gross-discount),f=gross?total/gross:1;
  const paid=r2(Math.min(Math.max(+o.paid||0,0),total)),due=r2(total-paid);
  if(due>0&&!o.supplierId)throw new Error('Select a supplier for a credit or partial payment purchase');
  const no='PUR-'+String(S.n.pur++).padStart(5,'0'),date=o.date||today();
  items.forEach(i=>{
    i.uc=i.cost*f;const p=prod(i.pid),base=Math.max(p.stock,0);
    p.cost=(base+i.qty)>0?(base*p.cost+i.qty*i.uc)/(base+i.qty):i.uc;
    move(p.id,'Purchase',i.qty,no,'',date);
  });
  const pu={id:uid(),no,date,supplierId:o.supplierId||null,ref:o.ref||'',items,gross,discount,total,paid,paid0:paid,method:o.method||'cash',credited:0,returns:[]};
  S.purchases.push(pu);
  post(date,no,'Purchase invoice '+no,[{acc:'1200',dr:total},{acc:payAcc(pu.method),cr:paid},{acc:'2000',cr:due}]);
  return pu;
}
function purchaseReturn(pid,qs,method,date){
  const pu=S.purchases.find(x=>x.id===pid);date=date||today();
  let val=0;const ret=[];
  pu.items.forEach((it,i)=>{
    const q=+qs[i]||0;if(q<=0)return;
    if(q>it.qty-it.returned+1e-9)throw new Error('Return quantity too high for '+it.name);
    const p=prod(it.pid);
    if(!S.settings.allowNegative&&p.stock<q)throw new Error('Not enough stock to return '+it.name);
    val+=q*it.uc;ret.push({i,q});
  });
  if(!ret.length)throw new Error('Enter a quantity to return');
  val=r2(val);
  const credit=r2(Math.min(pDueOf(pu),val)),refund=r2(val-credit);
  ret.forEach(x=>{const it=pu.items[x.i];it.returned=r3(it.returned+x.q);move(it.pid,'Purchase Return',-x.q,pu.no,'',date)});
  pu.credited=r2((pu.credited||0)+credit);
  pu.returns.push({date,val,credit,refund});
  post(date,pu.no,'Purchase return '+pu.no,[{acc:'2000',dr:credit},{acc:payAcc(method||'cash'),dr:refund},{acc:'1200',cr:val}]);
}
function receive(cid,amount,method,date,note){
  amount=r2(amount);const c=cust(cid);const bal=custBalance(c);
  if(!(amount>0))throw new Error('Enter an amount');
  if(amount>bal+0.004)throw new Error('Amount is more than the balance of '+money(bal));
  let left=amount;const uo=Math.min(left,c.opening);c.opening=r2(c.opening-uo);left=r2(left-uo);
  S.sales.filter(s=>s.customerId===cid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id).forEach(s=>{
    if(left<=0)return;const d=dueOf(s);if(d<=0)return;const a=Math.min(d,left);s.paid=r2(s.paid+a);left=r2(left-a);
  });
  const no='RCP-'+String(S.n.rcp++).padStart(5,'0');
  S.payments.push({id:uid(),no,type:'in',partyId:cid,amount,method,date:date||today(),note:note||''});
  post(date||today(),no,'Payment received '+no,[{acc:payAcc(method),dr:amount},{acc:'1100',cr:amount}]);
}

}

function decodeOrderCode(code){
  let b=code.slice(6).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
  const bin=atob(b);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));

}
function importOrders(text){
  const codes=String(text).match(/BSTO1:[A-Za-z0-9_-]+/g)||[];let added=0,dup=0,bad=0;
  codes.forEach(c=>{
    try{
      const o=decodeOrderCode(c);
      const items=(Array.isArray(o.it)?o.it:[]).map(x=>({pid:+x[0],qty:+x[1],name:String(x[3]||'')})).filter(x=>x.pid&&x.qty>0&&isFinite(x.qty));
      if(!o||!o.no||!items.length){bad++;return}
      if(S.orders.some(x=>x.no===o.no)){dup++;return}
      let cid=o.cid&&cust(+o.cid)?+o.cid:null;
      if(!cid&&o.cn){const m=S.customers.find(x=>x.name===o.cn);if(m)cid=m.id}
      S.orders.push({id:uid(),no:String(o.no),date:o.d||today(),taker:String(o.tk||''),customerId:cid,customerName:String(o.cn||''),level:o.lv==='wholesale'?'wholesale':'retail',items,note:String(o.nt||''),status:'Pending',saleNo:''});
      added++;
    }catch(e){bad++}
  });
  return{added,dup,bad,found:codes.length};
}

function rangeOf(k){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate();
  if(k==='today')return[ymd(n),ymd(n)];
  if(k==='yesterday'){const t=new Date(y,m,d-1);return[ymd(t),ymd(t)]}
  if(k==='week'){const w=(n.getDay()+6)%7;return[ymd(new Date(y,m,d-w)),ymd(n)]}
  if(k==='month')return[ymd(new Date(y,m,1)),ymd(n)];
  if(k==='lastmonth')return[ymd(new Date(y,m-1,1)),ymd(new Date(y,m,0))];
  if(k==='year')return[ymd(new Date(y,0,1)),ymd(n)];
  return['','9999-12-31']}

  let keys=[],lab=k=>k.slice(8),monthly=(r==='year'||r==='all');
  if(monthly){let s0=r==='year'?f.slice(0,7):((S.sales[0]&&S.sales[0].date)||today()).slice(0,7);let c=pd(s0+'-01');const end=today().slice(0,7);while(ymd(c).slice(0,7)<=end){keys.push(ymd(c).slice(0,7));c=new Date(c.getFullYear(),c.getMonth()+1,1)}lab=k=>['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+k.slice(5)-1]}
  else{let st=f;if(daysBetween(f,t)<6)st=ymd(addDays(pd(t),-6));for(let d=pd(st);ymd(d)<=t;d=addDays(d,1))keys.push(ymd(d))}
  const bucket={};S.sales.forEach(s=>{const k=monthly?s.date.slice(0,7):s.date;bucket[k]=(bucket[k]||0)+s.total});
  const mx=Math.max(1,...keys.map(k=>bucket[k]||0));
  const chart=`<div class="bars" role="img" aria-label="Sales trend">${keys.map(k=>`<div title="${k}: ${money(bucket[k]||0)}"><i style="height:${Math.round((bucket[k]||0)/mx*100)}%"></i>${keys.length<=16?lab(k):''}</div>`).join('')}</div>`;
  const tp={};sl.forEach(s=>s.items.forEach(i=>{const x=tp[i.name]=tp[i.name]||{q:0,a:0};x.q+=i.qty-i.returned;x.a+=(i.qty-i.returned)*i.price}));
  const topP=Object.entries(tp).sort((a,b)=>b[1].a-a[1].a).slice(0,6);
  const tc={};sl.forEach(s=>{const n=s.customerId?cust(s.customerId).name:'Walk-in';tc[n]=(tc[n]||0)+s.total});
  const topC=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const owe=S.customers.map(c=>[c,custBalance(c)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const li=(rows,fn)=>rows.length?`<ul class="list">${rows.map(fn).join('')}</ul>`:'<div class="empty" style="padding:18px">No data for this period.</div>';
  $('#dbody').innerHTML=`<div class="cards">${card('Sales',money(sales))}${card('Purchases',money(purch))}${card('Collection',money(coll))}${card('Expenses',money(exp))}${card('Net profit',money(profit),profit<0?'dn':'up')}</div>
  <div class="cards">${card('Receivables',money(recv))}${card('Payables',money(payb))}${card('Stock value',money(stockValue()))}${card('Low stock items',low.length,low.length?'dn':'')}${card('Customers',S.customers.length)}${card('Suppliers',S.suppliers.length)}</div>
  <div class="two"><div class="panel"><h3>Sales trend</h3>${chart}</div><div class="panel"><h3>Top products</h3>${li(topP,x=>`<li><span>${esc(x[0])}</span><b>${money(x[1].a)}</b></li>`)}</div></div>
  <div class="two" style="margin-top:16px"><div class="panel"><h3>Who owes us the most</h3>${li(owe,x=>`<li><span>${esc(x[0].name)}</span><b>${money(x[1])}</b></li>`)}</div><div class="panel"><h3>Top customers</h3>${li(topC,x=>`<li><span>${esc(x[0])}</span><b>${money(x[1])}</b></li>`)}</div></div>
  <div class="panel" style="margin-top:16px"><h3>Low stock</h3>${li(low.slice(0,8),p=>`<li><span>${esc(p.name)}</span><b class="dn">${qty(p.stock)} left (min ${qty(p.min)})</b></li>`)}</div>`;
};

/* ---------- POS ---------- */
function posTotals(){const sub=r2(POS.cart.reduce((a,l)=>a+l.qty*l.price,0));const disc=r2(Math.min(Math.max(+POS.disc||0,0),sub));const rev=r2(sub-disc);const tax=r2(rev*(+POS.tax||0)/100);return{sub,disc,rev,tax,total:r2(rev+tax)}}
PAGES.pos=()=>{
  if(POS.tax===null)POS.tax=S.settings.taxRate;
  V().innerHTML=`<div class="pos"><div><div class="bar"><input class="in grow" id="pq" placeholder="Search name, SKU or scan barcode (F2)" autocomplete="off" value="${esc(POS.q)}"><select class="in" id="plevel" data-chg="plevel"><option value="retail">Retail price</option><option value="wholesale">Wholesale price</option></select></div><div class="chips" id="pcats"></div><div class="pgrid" id="pgrid"></div></div><div class="cart" id="pcart"></div></div>`;
  $('#plevel').value=POS.level;
  $('#pq').addEventListener('input',e=>{POS.q=e.target.value;posGrid()});
  $('#pq').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const q=POS.q.trim().toLowerCase();if(!q)return;const list=S.products.filter(p=>p.active);const ex=list.find(p=>p.barcode&&p.barcode.toLowerCase()===q)||list.find(p=>p.sku.toLowerCase()===q);const hit=ex||(posFiltered().length===1?posFiltered()[0]:null);if(hit){posAdd(hit.id);POS.q='';e.target.value='';posGrid()}else toast('No single matching product','err')}});
  posGrid();posCart();
};
function posFiltered(){const q=POS.q.trim().toLowerCase();return S.products.filter(p=>p.active&&(!POS.cat||p.category===POS.cat)&&(!q||(p.name+' '+p.sku+' '+p.barcode).toLowerCase().includes(q)))}
function posGrid(){
  const cats=[...new Set(S.products.map(p=>p.category))].sort();
  $('#pcats').innerHTML=`<button data-act="pcat" data-c="" aria-pressed="${!POS.cat}">All</button>`+cats.map(c=>`<button data-act="pcat" data-c="${esc(c)}" aria-pressed="${POS.cat===c}">${esc(c)}</button>`).join('');
  const l=posFiltered().slice(0,120);
  $('#pgrid').innerHTML=l.length?l.map(p=>`<button data-act="padd" data-id="${p.id}" ${(!S.settings.allowNegative&&p.stock<=0)?'disabled':''}><b>${esc(p.name)}</b><small>${qty(p.stock)} ${esc(p.unit)} in stock</small><em>${money(POS.level==='wholesale'?p.wholesale:p.price)}</em></button>`).join(''):`<div class="empty" style="grid-column:1/-1">${S.products.length?'No products match.':'No products yet. Add products first.'}</div>`;
}
ACT.pcat=(e,d)=>{POS.cat=d.c;posGrid()};
function posAdd(id){const p=prod(id);if(!p)return;const l=POS.cart.find(x=>x.pid===id);const price=POS.level==='wholesale'?p.wholesale:p.price;
  const nq=(l?l.qty:0)+1;if(!S.settings.allowNegative&&nq>p.stock){toast('Only '+qty(p.stock)+' in stock','err');return}
  if(l)l.qty=nq;else POS.cart.push({pid:id,qty:1,price});posCart()}
ACT.padd=(e,d)=>posAdd(+d.id);
ACT.prm=(e,d)=>{POS.cart.splice(+d.i,1);posCart()};
ACT.pclear=()=>{POS.cart=[];POS.disc=0;POS.paid='';POS.cust='';POS.method='cash';posCart()};
CHG.plevel=e=>{POS.level=e.value;POS.cart.forEach(l=>{const p=prod(l.pid);l.price=POS.level==='wholesale'?p.wholesale:p.price});posGrid();posCart()};
CHG.pqty=e=>{const l=POS.cart[+e.dataset.i];const p=prod(l.pid);let q=+e.value;if(!(q>0)){POS.cart.splice(+e.dataset.i,1)}else{if(!S.settings.allowNegative&&q>p.stock){toast('Only '+qty(p.stock)+' in stock','err');q=p.stock}l.qty=q}posCart()};
CHG.pprice=e=>{POS.cart[+e.dataset.i].price=Math.max(0,+e.value||0);posCart()};
CHG.pf=e=>{POS[e.dataset.f]=e.value;posCart()};
function posCart(){
  const box=$('#pcart');if(!box)return;const t=posTotals();
  const lines=POS.cart.map((l,i)=>{const p=prod(l.pid);return `<div class="cl"><span>${esc(p.name)}</span><input class="in" type="number" min="0" step="any" value="${l.qty}" data-chg="pqty" data-i="${i}" aria-label="Quantity"><input class="in" type="number" min="0" step="any" value="${l.price}" data-chg="pprice" data-i="${i}" aria-label="Price"><button class="b b-s b-d" data-act="prm" data-i="${i}" aria-label="Remove">✕</button></div>`}).join('');
  const isCredit=POS.method==='credit';
  const paid=isCredit?0:(POS.paid===''?t.total:Math.min(Math.max(+POS.paid||0,0),t.total));
  const change=(!isCredit&&POS.paid!==''&&+POS.paid>t.total)?r2(+POS.paid-t.total):0;
  const due=r2(t.total-paid);
  box.innerHTML=`<label class="f"><span>Customer</span><select class="in" data-chg="pf" data-f="cust"><option value="">Walk-in customer</option>${opt(S.customers.map(c=>[c.id,c.name]),POS.cust)}</select></label>
  <div class="cl-w">${lines||'<div class="empty" style="padding:22px">Cart is empty. Tap a product or scan a barcode.</div>'}</div>
  <div class="fg" style="grid-template-columns:1fr 1fr"><label class="f"><span>Discount</span><input class="in" type="number" min="0" step="any" value="${POS.disc||''}" data-chg="pf" data-f="disc" placeholder="0"></label><label class="f"><span>Tax %</span><input class="in" type="number" min="0" step="any" value="${POS.tax}" data-chg="pf" data-f="tax"></label></div>
  <div class="tot"><span>Subtotal</span><span>${money(t.sub)}</span></div>${t.disc?`<div class="tot"><span>Discount</span><span>− ${money(t.disc)}</span></div>`:''}${t.tax?`<div class="tot"><span>Tax</span><span>${money(t.tax)}</span></div>`:''}
  <div class="tot big"><span>Total</span><span>${money(t.total)}</span></div>
  <div class="fg" style="grid-template-columns:1fr 1fr"><label class="f"><span>Payment</span><select class="in" data-chg="pf" data-f="method"><option value="cash"${POS.method==='cash'?' selected':''}>Cash</option><option value="bank"${POS.method==='bank'?' selected':''}>Bank</option><option value="card"${POS.method==='card'?' selected':''}>Card</option><option value="online"${POS.method==='online'?' selected':''}>Online</option><option value="credit"${POS.method==='credit'?' selected':''}>Credit (pay later)</option></select></label><label class="f"><span>Amount received</span><input class="in" type="number" min="0" step="any" value="${POS.paid}" data-chg="pf" data-f="paid" placeholder="${isCredit?'0':t.total}" ${isCredit?'disabled':''}></label></div>
  ${change?`<div class="tot"><span>Change to return</span><b>${money(change)}</b></div>`:''}${due>0?`<div class="tot"><span>Left on credit</span><b class="dn">${money(due)}</b></div>`:''}
  <div style="display:flex;gap:8px"><button class="b" data-act="pclear">Clear (F4)</button><button class="b b-a sp" style="flex:1" data-act="pcheck">Complete sale (F9)</button></div>`;
}
ACT.pcheck=()=>{
  const t=posTotals();if(!POS.cart.length){toast('Cart is empty','err');return}
  const isCredit=POS.method==='credit';
  const paid=isCredit?0:(POS.paid===''?t.total:Math.min(Math.max(+POS.paid||0,0),t.total));
  const s=tx(()=>createSale({customerId:POS.cust?+POS.cust:null,items:POS.cart.map(l=>({pid:l.pid,qty:l.qty,price:l.price})),discount:POS.disc,taxRate:POS.tax,paid,method:isCredit?'cash':POS.method}));
  if(!s)return;
  POS.cart=[];POS.disc=0;POS.paid='';POS.method='cash';
  posGrid();posCart();
  modal('Sale complete — '+s.no,invoiceHTML(s),null,{wide:true});
  $('#mb').insertAdjacentHTML('beforeend',`<div style="margin-top:12px;display:flex;gap:8px">${bt('Print receipt','print',{id:s.id},'b-p')}</div>`);
};
document.addEventListener('keydown',e=>{
  if(location.hash!=='#/pos'||$('#modal').open)return;
  if(e.key==='F2'){e.preventDefault();$('#pq')&&$('#pq').focus()}
  if(e.key==='F4'){e.preventDefault();ACT.pclear()}
  if(e.key==='F9'){e.preventDefault();ACT.pcheck()}
});

ACT.pexport=()=>download('products.csv',csv([['name','sku','barcode','category','brand','unit','cost','price','wholesale','min','stock'],...S.products.map(p=>[p.name,p.sku,p.barcode,p.category,p.brand,p.unit,r2(p.cost),p.price,p.wholesale,p.min,p.stock])]));
ACT.pimport=()=>modal('Import products from CSV',`<p>Columns: <b>name, sku, barcode, category, brand, unit, cost, price, wholesale, min, stock</b>. Only <b>name</b> is required. Rows with an existing SKU are skipped. In Excel, use Save As → CSV.</p><div style="display:flex;gap:8px;flex-wrap:wrap">${bt('Download template','ptemplate')}${bt('Choose CSV file','pfile','', 'b-p')}</div>`,null);
ACT.ptemplate=()=>download('products-template.csv',csv([['name','sku','barcode','category','brand','unit','cost','price','wholesale','min','stock'],['Sample Product','SP001','1234567890','General','','pcs','100','120','110','10','50']]));
ACT.pfile=()=>pickFile('.csv,text/csv',t=>{
  const rows=parseCSV(t);if(rows.length<2){toast('The file has no data rows','err');return}
  const h=rows[0].map(x=>x.trim().toLowerCase());const ix=k=>h.indexOf(k);
  if(ix('name')<0){toast('Missing "name" column','err');return}
  let added=0,skipped=0;const errs=[];
  const ok=tx(()=>{rows.slice(1).forEach((r,n)=>{const g=k=>ix(k)<0?'':(r[ix(k)]||'').trim();
    try{createProduct({name:g('name'),sku:g('sku'),barcode:g('barcode'),category:g('category'),brand:g('brand'),unit:g('unit')||'pcs',cost:+g('cost')||0,price:+g('price')||0,wholesale:+g('wholesale')||0,min:+g('min')||0,stock:+g('stock')||0});added++}catch(e){skipped++;errs.push('Row '+(n+2)+': '+e.message)}})});

  },{okText:'Record payment'})};
function stmtRows(kind,c){
  const rows=[];
  if(kind==='c'){
    S.sales.filter(s=>s.customerId===c.id).forEach(s=>{rows.push([s.date,s.id,'Invoice '+s.no,s.total,0]);if(s.paid0)rows.push([s.date,s.id+.1,'Paid at sale',0,s.paid0]);s.returns.forEach((r,i)=>{rows.push([r.date,s.id+.2+i/100,'Return '+s.no,0,r.tot]);if(r.refund)rows.push([r.date,s.id+.3+i/100,'Refund paid',r.refund,0])})});
    S.payments.filter(p=>p.type==='in'&&p.partyId===c.id).forEach(p=>rows.push([p.date,p.id,'Receipt '+p.no,0,p.amount]));
  }else{
    S.purchases.filter(p=>p.supplierId===c.id).forEach(p=>{rows.push([p.date,p.id,'Purchase '+p.no,p.total,0]);if(p.paid0)rows.push([p.date,p.id+.1,'Paid at purchase',0,p.paid0]);p.returns.forEach((r,i)=>{rows.push([r.date,p.id+.2+i/100,'Return '+p.no,0,r.val]);if(r.refund)rows.push([r.date,p.id+.3+i/100,'Refund received',r.refund,0])})});
    S.payments.filter(p=>p.type==='out'&&p.partyId===c.id).forEach(p=>rows.push([p.date,p.id,'Payment '+p.no,0,p.amount]));
  }
  rows.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:a[1]-b[1]);
  let b=c.openingInit;const out=[['','','Opening balance','','',money(b)]];
  rows.forEach(r=>{b=r2(b+r[3]-r[4]);out.push([r[0],'',r[2],r[3]?money(r[3]):'',r[4]?money(r[4]):'',money(b)])});
  return out;
}

  const html=`<div class="inv"><div class="inv-h"><div><h2>${esc(S.settings.name)}</h2><div>Statement of account</div></div><div class="r"><b>${esc(c.name)}</b><div>${esc(c.phone)}</div><div>${today()}</div></div></div>${tbl([['Date'],[''],['Details'],[d.k==='c'?'Charges':'Purchases','r'],['Payments','r'],['Balance','r']],stmtRows(d.k,c).map(r=>r.map((v,i)=>i===1?'':v)))}<div class="sum"><div><b>Balance</b><b>${money(bal)}</b></div></div></div>`;
  modal('Statement — '+c.name,html,null,{wide:true});
  $('#mb').insertAdjacentHTML('beforeend',`<div style="margin-top:12px;display:flex;gap:8px"><button class="b b-p" id="pst">Print</button></div>`);
  $('#pst').onclick=()=>printHTML(html);
};

ACT.pnews=()=>{if(!S.suppliers.length){toast('Add a supplier first','err');return}modal('Pay supplier',`<div class="fg">${sel('Supplier','pp_c',S.suppliers.map(c=>[c.id,c.name+' — '+money(supBalance(c))]),'')}</div>`,()=>{const id=val('pp_c');setTimeout(()=>ACT.ppay(null,{k:'s',id}),0)},{okText:'Next'})};

PAGES.accounting=()=>{
  UI.acc=UI.acc||{tab:'coa',code:'1000',from:rangeOf('month')[0],to:today()};const u=UI.acc;
  const tabs=[['coa','Chart of accounts'],['journal','Journal'],['ledger','Ledger'],['tb','Trial balance'],['pl','Profit & loss'],['bs','Balance sheet']];
  V().innerHTML=`<div class="bar"><div class="tabs">${tabs.map(([k,t])=>`<button data-act="atab" data-t="${k}" aria-pressed="${u.tab===k}">${t}</button>`).join('')}</div>
  ${u.tab==='coa'?`<button class="b sp" data-act="anew">+ Account</button><button class="b" data-act="aopen">Opening cash / bank</button>`:''}${u.tab==='journal'?`<button class="b b-p sp" data-act="jnew">+ Manual journal</button>`:''}
  ${u.tab==='ledger'?`<select class="in grow" name="code" data-inp="acc">${opt(S.accounts.map(a=>[a.code,a.code+' · '+a.name]),u.code)}</select>`:''}
  ${u.tab==='pl'?`<input class="in sp" type="date" name="from" data-inp="acc" value="${u.from}" aria-label="From"><input class="in" type="date" name="to" data-inp="acc" value="${u.to}" aria-label="To">`:''}</div><div id="tbl"></div>`;
  TBL.acc();
};
ACT.atab=(e,d)=>{UI.acc.tab=d.t;PAGES.accounting()};
const typeName={asset:'Asset',liability:'Liability',equity:'Equity',income:'Income',expense:'Expense'};
TBL.acc=()=>{
  const u=UI.acc,box=$('#tbl');
  if(u.tab==='coa')box.innerHTML=tbl([['Code'],['Account'],['Type'],['Balance','r']],S.accounts.map(a=>[a.code,esc(a.name),typeName[a.type],money(natBal(a))]));
  if(u.tab==='journal'){const l=[...S.journal].reverse().slice(0,150);box.innerHTML=tbl([['Date'],['Ref'],['Description'],['Account'],['Debit','r'],['Credit','r']],l.flatMap(j=>j.lines.map((x,i)=>[i?'':j.date,i?'':esc(j.ref),i?'':esc(j.memo),esc(x.acc+' '+(acct(x.acc)||{}).name),x.dr?money(x.dr):'',x.cr?money(x.cr):''])),'No journal entries yet.')}
  if(u.tab==='ledger'){const a=acct(u.code);let b=0,rows=[];S.journal.forEach(j=>j.lines.forEach(l=>{if(l.acc===u.code){b=r2(b+((a.type==='asset'||a.type==='expense')?l.dr-l.cr:l.cr-l.dr));rows.push([j.date,esc(j.ref),esc(j.memo),l.dr?money(l.dr):'',l.cr?money(l.cr):'',money(b)])}}));box.innerHTML=tbl([['Date'],['Ref'],['Description'],['Debit','r'],['Credit','r'],['Balance','r']],rows.reverse().slice(0,400),'No transactions on this account.')}
  if(u.tab==='tb'){let D=0,C=0;const rows=S.accounts.map(a=>{const x=acctTotals(a.code);const n=r2(x.dr-x.cr);const d=n>0?n:0,c=n<0?-n:0;D+=d;C+=c;return [a.code,esc(a.name),d?money(d):'',c?money(c):'']});box.innerHTML=tbl([['Code'],['Account'],['Debit','r'],['Credit','r']],rows,'',['','Total',money(D),money(C)])+`<p style="margin-top:10px">${r2(D)===r2(C)?'<span class="bdg ok">Balanced</span>':'<span class="bdg bad">Out of balance</span>'}</p>`}
  if(u.tab==='pl'){
    const g=t=>S.accounts.filter(a=>a.type===t).map(a=>[a,natBal(a,u.from,u.to)]);
    const inc=g('income'),cogs=g('expense').filter(x=>x[0].code==='5000'),oth=g('expense').filter(x=>x[0].code!=='5000');
    const sum=l=>r2(l.reduce((a,x)=>a+x[1],0));const gp=r2(sum(inc)-sum(cogs)),np=r2(gp-sum(oth));
    const sec=(t,l,s)=>`<tr><td colspan="2"><b>${t}</b></td></tr>${l.map(x=>`<tr><td>&nbsp;&nbsp;${esc(x[0].name)}</td><td class="r">${money(x[1])}</td></tr>`).join('')}<tr><td><b>Total ${t.toLowerCase()}</b></td><td class="r"><b>${money(s)}</b></td></tr>`;
    box.innerHTML=`<div class="tw"><table class="tbl"><tbody>${sec('Income',inc,sum(inc))}${sec('Cost of goods sold',cogs,sum(cogs))}<tr><td><b>Gross profit</b></td><td class="r"><b>${money(gp)}</b></td></tr>${sec('Expenses',oth,sum(oth))}<tr><td><b>Net profit</b></td><td class="r"><b class="${np<0?'dn':'up'}">${money(np)}</b></td></tr></tbody></table></div>`;
  }
  if(u.tab==='bs'){
    const g=t=>S.accounts.filter(a=>a.type===t).map(a=>[a,natBal(a)]);const A=g('asset'),L=g('liability'),E=g('equity');
    const earn=r2(g('income').reduce((a,x)=>a+x[1],0)-g('expense').reduce((a,x)=>a+x[1],0));
    const sum=l=>r2(l.reduce((a,x)=>a+x[1],0));const eq=r2(sum(E)+earn);
    const sec=(t,l,s,extra)=>`<tr><td colspan="2"><b>${t}</b></td></tr>${l.map(x=>`<tr><td>&nbsp;&nbsp;${esc(x[0].name)}</td><td class="r">${money(x[1])}</td></tr>`).join('')}${extra||''}<tr><td><b>Total ${t.toLowerCase()}</b></td><td class="r"><b>${money(s)}</b></td></tr>`;
    box.innerHTML=`<div class="tw"><table class="tbl"><tbody>${sec('Assets',A,sum(A))}${sec('Liabilities',L,sum(L))}${sec('Equity',E,eq,`<tr><td>&nbsp;&nbsp;Retained earnings (all time)</td><td class="r">${money(earn)}</td></tr>`)}</tbody></table></div><p style="margin-top:10px">${r2(sum(A))===r2(sum(L)+eq)?'<span class="bdg ok">Assets = Liabilities + Equity</span>':'<span class="bdg bad">Does not balance</span>'}</p>`;
  }
};
ACT.anew=()=>modal('New account',`<div class="fg">${fld('Code','n_code','')}${fld('Name','n_name','')}${sel('Type','n_type',Object.entries(typeName),'expense')}</div>`,()=>{const ok=tx(()=>{const c=val('n_code').trim(),n=val('n_name').trim();if(!c||!n)throw new Error('Code and name are required');if(acct(c))throw new Error('Code already exists');S.accounts.push({code:c,name:n,type:val('n_type')});S.accounts.sort((a,b)=>a.code<b.code?-1:1)},'Account added');if(!ok)return false;PAGES.accounting()});
ACT.aopen=()=>modal('Opening cash / bank balance',`<p>Posts a balanced entry against Owner's Equity.</p><div class="fg">${fld('Date','o_d',today(),'date')}${sel('Account','o_a',[['1000','Cash in Hand'],['1010','Bank Account']],'1000')}${fld('Amount','o_v','','number','min="0" step="any"')}</div>`,()=>{const ok=tx(()=>{const v=r2(numv('o_v'));if(!(v>0))throw new Error('Enter an amount');post(val('o_d'),'OPEN','Opening balance',[{acc:val('o_a'),dr:v},{acc:'3000',cr:v}])},'Opening balance posted');if(!ok)return false;PAGES.accounting()});
ACT.jnew=()=>{const ao=S.accounts.map(a=>[a.code,a.code+' · '+a.name]);const row=()=>`<div class="cl jrow" style="grid-template-columns:1fr 100px 100px;margin-bottom:6px"><select class="in j-a">${opt(ao,'')}</select><input class="in j-d" type="number" min="0" step="any" placeholder="Debit"><input class="in j-c" type="number" min="0" step="any" placeholder="Credit"></div>`;
  modal('Manual journal entry',`<div class="fg">${fld('Date','j_d',today(),'date')}${fld('Description','j_m','')}</div><div id="jrows" style="margin-top:12px">${row()}${row()}</div><button class="b b-s" id="jadd">+ Add line</button>`,()=>{const lines=$$('.jrow').map(r=>({acc:r.querySelector('.j-a').value,dr:+r.querySelector('.j-d').value||0,cr:+r.querySelector('.j-c').value||0}));const ok=tx(()=>{if(lines.filter(l=>l.dr||l.cr).length<2)throw new Error('Enter at least two lines');manualJournal(val('j_d'),val('j_m'),lines)},'Journal posted');if(!ok)return false;PAGES.accounting()},{wide:true});
  $('#jadd').onclick=()=>$('#jrows').insertAdjacentHTML('beforeend',row())};

/* ---------- Reports ---------- */
const REPORTS={
  salesday:{t:'Sales by day',d:1,cols:[['Date'],['Invoices','r'],['Sales','r'],['Paid at sale','r']],run:(f,t)=>{const m={};S.sales.filter(s=>inR(s.date,f,t)).forEach(s=>{const x=m[s.date]=m[s.date]||[0,0,0];x[0]++;x[1]+=s.total;x[2]+=s.paid0});return Object.keys(m).sort().map(k=>[k,m[k][0],r2(m[k][1]),r2(m[k][2])])},types:['t','q','m','m']},
  salesprod:{t:'Sales & profit by product',d:1,cols:[['Product'],['Qty sold','r'],['Sales','r'],['Cost','r'],['Profit','r']],run:(f,t)=>{const m={};S.sales.filter(s=>inR(s.date,f,t)).forEach(s=>{const k=s.subtotal?1-s.discount/s.subtotal:1;s.items.forEach(i=>{const n=i.qty-i.returned;const x=m[i.name]=m[i.name]||[0,0,0];x[0]+=n;x[1]+=n*i.price*k;x[2]+=n*i.cost})});return Object.entries(m).sort((a,b)=>b[1][1]-a[1][1]).map(([k,x])=>[k,r3(x[0]),r2(x[1]),r2(x[2]),r2(x[1]-x[2])])},types:['t','q','m','m','m']},
  salescust:{t:'Sales by customer',d:1,cols:[['Customer'],['Invoices','r'],['Sales','r'],['Balance','r']],run:(f,t)=>{const m={};S.sales.filter(s=>inR(s.date,f,t)).forEach(s=>{const k=s.customerId||0;const x=m[k]=m[k]||[0,0];x[0]++;x[1]+=s.total});return Object.entries(m).sort((a,b)=>b[1][1]-a[1][1]).map(([k,x])=>[+k?cust(+k).name:'Walk-in',x[0],r2(x[1]),+k?custBalance(cust(+k)):0])},types:['t','q','m','m']},
  salescat:{t:'Sales by category',d:1,cols:[['Category'],['Qty','r'],['Sales','r']],run:(f,t)=>{const m={};S.sales.filter(s=>inR(s.date,f,t)).forEach(s=>s.items.forEach(i=>{const c=(prod(i.pid)||{}).category||'—';const x=m[c]=m[c]||[0,0];x[0]+=i.qty-i.returned;x[1]+=(i.qty-i.returned)*i.price}));return Object.entries(m).sort((a,b)=>b[1][1]-a[1][1]).map(([k,x])=>[k,r3(x[0]),r2(x[1])])},types:['t','q','m']},
  purchsup:{t:'Purchases by supplier',d:1,cols:[['Supplier'],['Purchases','r'],['Total','r'],['Balance','r']],run:(f,t)=>{const m={};S.purchases.filter(p=>inR(p.date,f,t)).forEach(p=>{const k=p.supplierId||0;const x=m[k]=m[k]||[0,0];x[0]++;x[1]+=p.total});return Object.entries(m).sort((a,b)=>b[1][1]-a[1][1]).map(([k,x])=>[+k?supp(+k).name:'Cash purchases',x[0],r2(x[1]),+k?supBalance(supp(+k)):0])},types:['t','q','m','m']},
  stockval:{t:'Stock valuation',cols:[['Product'],['Stock','r'],['Cost','r'],['Value','r']],run:()=>S.products.filter(p=>p.stock!==0).map(p=>[p.name,p.stock,r2(p.cost),r2(p.stock*p.cost)]).sort((a,b)=>b[3]-a[3]),types:['t','q','m','m']},
  lowstock:{t:'Low stock',cols:[['Product'],['Stock','r'],['Minimum','r']],run:()=>S.products.filter(p=>p.active&&p.min>0&&p.stock<=p.min).map(p=>[p.name,p.stock,p.min]),types:['t','q','q']},
  deadstock:{t:'Dead stock (no sale in 60 days)',cols:[['Product'],['Stock','r'],['Value','r'],['Last sold']],run:()=>{const cut=dayOff(-60);return S.products.filter(p=>p.stock>0).map(p=>{const m=S.movements.filter(x=>x.pid===p.id&&x.type==='Sale');const last=m.length?m[m.length-1].date:'never';return[p,last]}).filter(x=>x[1]==='never'||x[1]<cut).map(x=>[x[0].name,x[0].stock,r2(x[0].stock*x[0].cost),x[1]])},types:['t','q','m','t']},
  fastmove:{t:'Fast moving (last 30 days)',cols:[['Product'],['Qty sold','r'],['Stock','r']],run:()=>{const cut=dayOff(-30);const m={};S.movements.filter(x=>x.type==='Sale'&&x.date>=cut).forEach(x=>m[x.pid]=(m[x.pid]||0)-x.qty);return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,30).map(([k,v])=>[prod(+k).name,r3(v),prod(+k).stock])},types:['t','q','q']},
  slowmove:{t:'Slow moving (last 30 days)',cols:[['Product'],['Qty sold','r'],['Stock','r']],run:()=>{const cut=dayOff(-30);const m={};S.movements.filter(x=>x.type==='Sale'&&x.date>=cut).forEach(x=>m[x.pid]=(m[x.pid]||0)-x.qty);return S.products.filter(p=>p.stock>0).map(p=>[p.name,r3(m[p.id]||0),p.stock]).sort((a,b)=>a[1]-b[1]).slice(0,30)},types:['t','q','q']},
  arag:{t:'Receivables aging',cols:[['Customer'],['Current','r'],['1–30','r'],['31–60','r'],['61–90','r'],['90+','r'],['Total','r']],run:()=>agingRows('c'),types:['t','m','m','m','m','m','m']},
  apag:{t:'Payables aging',cols:[['Supplier'],['Current','r'],['1–30','r'],['31–60','r'],['61–90','r'],['90+','r'],['Total','r']],run:()=>agingRows('s'),types:['t','m','m','m','m','m','m']}
};
function agingRows(kind){
  const list=kind==='c'?S.customers:S.suppliers,out=[];
  list.forEach(c=>{const b=[0,0,0,0,0];
    (kind==='c'?S.sales.filter(s=>s.customerId===c.id).map(s=>[s.date,dueOf(s)]):S.purchases.filter(p=>p.supplierId===c.id).map(p=>[p.date,pDueOf(p)])).forEach(([d,v])=>{if(v<=0)return;const age=daysBetween(d,today());b[age<=0?0:age<=30?1:age<=60?2:age<=90?3:4]+=v});
    b[4]+=c.opening;const tot=b.reduce((a,x)=>a+x,0);if(tot>0)out.push([c.name,...b.map(r2),r2(tot)])});
  return out.sort((a,b)=>b[6]-a[6]);
}
PAGES.reports=()=>{
  UI.rep=UI.rep||{id:'salesday',from:rangeOf('month')[0],to:today()};const u=UI.rep;const R=REPORTS[u.id];
  V().innerHTML=`<div class="bar"><select class="in" name="id" data-inp="rep" aria-label="Report">${opt(Object.entries(REPORTS).map(([k,r])=>[k,r.t]),u.id)}</select>${R.d?`<input class="in" type="date" name="from" data-inp="rep" value="${u.from}" aria-label="From"><input class="in" type="date" name="to" data-inp="rep" value="${u.to}" aria-label="To">`:''}<button class="b sp" data-act="rcsv">Export CSV</button><button class="b b-p" data-act="rprint">Print</button></div><div id="tbl"></div>`;
  TBL.rep();
};
function repData(){const u=UI.rep,R=REPORTS[u.id];return{R,rows:R.run(u.from,u.to)}}
TBL.rep=()=>{const{R,rows}=repData();const f=(v,t)=>t==='m'?money(v):t==='q'?qty(v):esc(v);const tot=R.types.map((t,i)=>i===0?'Total':(t==='m'?money(rows.reduce((a,r)=>a+(+r[i]||0),0)):''));
  $('#tbl').innerHTML=tbl(R.cols.map((c,i)=>[c[0],R.types[i]==='t'?'':'r']),rows.map(r=>r.map((v,i)=>f(v,R.types[i]))),'No data for this report.',rows.length&&R.types.includes('m')?tot:null)};
ACT.rcsv=()=>{const{R,rows}=repData();download(UI.rep.id+'.csv',csv([R.cols.map(c=>c[0]),...rows]))};
ACT.rprint=()=>{const{R}=repData();printHTML(`<div class="inv"><h2>${esc(S.settings.name)}</h2><h3 style="margin:6px 0 12px;letter-spacing:0">${esc(R.t)}</h3>${$('#tbl').innerHTML}</div>`)};

  <div class="panel"><h3>Demo &amp; reset</h3><div class="bar"><button class="b" data-act="demo">Load demo data</button><button class="b b-d" data-act="wipe">Erase everything</button></div></div>`;
};
ACT.ssave=()=>{tx(()=>Object.assign(S.settings,{name:val('s_name').trim()||'Business',phone:val('s_ph'),email:val('s_em'),address:val('s_ad'),currency:val('s_cur')||'Rs',taxRate:numv('s_tax'),invPrefix:val('s_pre'),footer:val('s_ft'),allowNegative:val('s_neg')==='1'}),'Settings saved');POS.tax=S.settings.taxRate};
ACT.bkexp=()=>download('be-shad-trader-backup-'+today()+'.json',JSON.stringify(S),'application/json');
ACT.bkimp=()=>pickFile('.json,application/json',t=>{try{const x=JSON.parse(t);if(!x.accounts||!x.journal)throw new Error('This is not a BE SHAD TRADER backup');if(!confirm('Replace all current data with this backup?'))return;S=Object.assign(fresh(),x);save();toast('Backup restored');go('dashboard');render()}catch(e){toast(e.message,'err')}});
ACT.wipe=()=>{if(prompt('Type ERASE to delete all data on this device')==='ERASE'){S=fresh();save();toast('All data erased');go('dashboard');render()}};
ACT.ex=(e,d)=>{const t=d.t;const m={
  customers:[['name','phone','city','balance'],()=>S.customers.map(c=>[c.name,c.phone,c.city,custBalance(c)])],
  suppliers:[['name','phone','city','balance'],()=>S.suppliers.map(c=>[c.name,c.phone,c.city,supBalance(c)])],
  purchases:[['purchase','date','supplier','total','paid','due'],()=>S.purchases.map(p=>[p.no,p.date,(supp(p.supplierId)||{}).name||'Cash',p.total,p.paid+(p.credited||0),pDueOf(p)])],
  payments:[['ref','date','type','party','method','amount'],()=>S.payments.map(p=>[p.no,p.date,p.type,((p.type==='in'?cust(p.partyId):supp(p.partyId))||{}).name,p.method,p.amount])],
  expenses:[['date','category','note','method','amount','voided'],()=>S.expenses.map(x=>[x.date,(acct(x.acc)||{}).name,x.note,x.method,x.amount,x.voided?'yes':''])]}[t];
  download(t+'.csv',csv([m[0],...m[1]()]))};

/* ---------- Search, shell, router ---------- */
$('#gsearch').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase(),box=$('#gres');if(q.length<2){box.hidden=true;return}
  const res=[];
  S.products.filter(p=>(p.name+p.sku+p.barcode).toLowerCase().includes(q)).slice(0,4).forEach(p=>res.push(['Product',p.name,'gs','p',p.id]));
  S.customers.filter(c=>(c.name+c.phone+c.company).toLowerCase().includes(q)).slice(0,3).forEach(c=>res.push(['Customer',c.name,'gs','c',c.id]));
  S.suppliers.filter(c=>(c.name+c.phone+c.company).toLowerCase().includes(q)).slice(0,3).forEach(c=>res.push(['Supplier',c.name,'gs','s',c.id]));
  S.sales.filter(s=>s.no.toLowerCase().includes(q)).slice(-3).forEach(s=>res.push(['Invoice',s.no+' · '+money(s.total),'gs','i',s.id]));
  S.purchases.filter(s=>s.no.toLowerCase().includes(q)).slice(-2).forEach(s=>res.push(['Purchase',s.no+' · '+money(s.total),'gs','u',s.id]));
  box.innerHTML=res.length?res.map(r=>`<button data-act="gs" data-t="${r[3]}" data-id="${r[4]}"><small>${r[0]}</small><span>${esc(r[1])}</span></button>`).join(''):'<div style="padding:12px 14px;color:var(--mut)">No results</div>';box.hidden=false;
});
ACT.gs=(e,d)=>{$('#gres').hidden=true;$('#gsearch').value='';const id=+d.id;
  if(d.t==='p'){UI.products=UI.products||{q:'',cat:'',show:'all'};UI.products.q=prod(id).name;UI.products.show='all';go('products');render()}
  else if(d.t==='c'||d.t==='s'){go(d.t==='c'?'customers':'suppliers');render();ACT.stmt(null,{k:d.t,id})}
  else if(d.t==='i'){go('sales');render();ACT.sview(null,{id})}
  else{go('purchases');render();ACT.pview(null,{id})}};
document.addEventListener('click',e=>{
  if(!e.target.closest('.gs'))$('#gres').hidden=true;
  const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act]){e.preventDefault();ACT[el.dataset.act](el,el.dataset)}
  if(e.target.closest('#nav a,#bottom a'))$('#side').classList.remove('open');
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.chg&&CHG[el.dataset.chg])CHG[el.dataset.chg](el)});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.inp){const u=UI[el.dataset.inp];u[el.name]=el.type==='checkbox'?el.checked:el.value;const fn={products:'products',inv:'inv',sales:'sales',pur:'pur',cus:'cus',sup:'sup',exp:'exp',acc:'acc',rep:'rep'}[el.dataset.inp];
    if(el.name==='id'||el.name==='code'){render()}else if(el.dataset.inp==='inv'&&el.name!=='q'){TBL.inv()}else TBL[fn]()}
  if(el.dataset.inp2==='pcalc')ACT.pcalc();
});
$('#burger').onclick=()=>$('#side').classList.toggle('open');
$('#theme').onclick=()=>{const d=document.documentElement;const dark=d.getAttribute('data-theme')==='dark';d.setAttribute('data-theme',dark?'light':'dark')};
if(matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark');
const go=p=>{location.hash='#/'+p};
function refresh(){render()}
function render(){
  const p=(location.hash.replace('#/','')||'dashboard');const pg=PAGES[p]?p:'dashboard';
  $('#nav').innerHTML=NAV.map(n=>`<a href="#/${n[0]}" class="${n[0]===pg?'on':''}"><span>${n[2]}</span>${n[1]}</a>`).join('');
  $('#bottom').innerHTML=['dashboard','pos','products','sales'].map(k=>{const n=NAV.find(x=>x[0]===k);return `<a href="#/${k}" class="${k===pg?'on':''}"><span>${n[2]}</span>${n[1]}</a>`}).join('')+`<a href="#" data-act="more"><span>☰</span>More</a>`;
  $('#title').textContent=NAV.find(n=>n[0]===pg)[1];
  $('#side').classList.remove('open');
  $('#gres').hidden=true;$('#gsearch').value='';
  PAGES[pg]();
  window.scrollTo(0,0);
}
ACT.more=()=>$('#side').classList.add('open');
window.addEventListener('hashchange',render);
render();
if(!persist)toast('Browser storage is unavailable. Data will not be saved.','err');
</script>
</body>
</html>
